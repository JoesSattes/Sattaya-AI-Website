<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="960" height="380" rx="20" fill="#0f1820"/>
  <text x="40" y="52" fill="#e8eef3" font-size="22" font-weight="600">Voice-to-voice latency budget (target ≈ 800 ms)</text>
  <text x="40" y="80" fill="#7d8fa1" font-size="15">Time from the user stopping speaking to the first audio coming back</text>
  <g font-size="14">
    <rect x="40" y="120" width="230" height="64" rx="10" fill="#1b3a46"/>
    <text x="54" y="148" fill="#e8eef3" font-weight="600">End-of-turn detection</text>
    <text x="54" y="170" fill="#9fb4c4">~250 ms</text>
    <rect x="274" y="120" width="120" height="64" rx="10" fill="#18414a"/>
    <text x="288" y="148" fill="#e8eef3" font-weight="600">ASR final</text>
    <text x="288" y="170" fill="#9fb4c4">~100 ms</text>
    <rect x="398" y="120" width="270" height="64" rx="10" fill="#1d4d4c"/>
    <text x="412" y="148" fill="#e8eef3" font-weight="600">LLM time-to-first-token</text>
    <text x="412" y="170" fill="#9fb4c4">~300 ms (incl. routing + retrieval)</text>
    <rect x="672" y="120" width="140" height="64" rx="10" fill="#21585a"/>
    <text x="686" y="148" fill="#e8eef3" font-weight="600">TTS first chunk</text>
    <text x="686" y="170" fill="#9fb4c4">~100 ms</text>
    <rect x="816" y="120" width="104" height="64" rx="10" fill="#2a3a48"/>
    <text x="830" y="148" fill="#e8eef3" font-weight="600">Network</text>
    <text x="830" y="170" fill="#9fb4c4">~50 ms</text>
  </g>
  <line x1="40" y1="214" x2="920" y2="214" stroke="#2b3c4a" stroke-width="2"/>
  <g fill="#7d8fa1" font-size="13" font-family="ui-monospace, Menlo, monospace">
    <text x="40" y="238">0</text><text x="262" y="238">250</text><text x="386" y="238">350</text><text x="656" y="238">650</text><text x="800" y="238">750</text><text x="890" y="238">800 ms</text>
  </g>
  <g font-size="15">
    <circle cx="48" cy="284" r="6" fill="#3fd0c0"/>
    <text x="64" y="289" fill="#b3c0cc">Everything streams: ASR emits partials, the LLM streams tokens, TTS starts on the first sentence.</text>
    <circle cx="48" cy="320" r="6" fill="#f2b544"/>
    <text x="64" y="325" fill="#b3c0cc">The LLM slice is the only one that grows with load — that is where batching and routing pay off.</text>
  </g>
</svg>
