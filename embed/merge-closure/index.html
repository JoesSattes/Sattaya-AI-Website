ict" data-mc-verdict data-astro-cid-qqvmtq5n></p></div></div></div><div class="fig-foot"><div class="fig-caption">A made-up example of real mechanics. BPE builds “there” by merging t+h, then th+e, then the+re. In text, “th” almost never shows up as a token on its own, so a keep rule that counts tokens drops it. In the paper this left a median 828 unreachable rows per setting and made new text re-split 1.9× as often as the usual check reports. Merge closure keeps the parents and costs a median 5.9% more rows.</div><div class="fig-meta"><a href="https://doi.org/10.13140/RG.2.2.10665.15200" rel="noopener">Mechanism: Sennrich et al. 2016. Numbers: Singkul 2026, Section 5.3</a></div></div><div class="fig-tip" role="status" aria-live="polite" hidden></div></figure><script type="module">document.querySelectorAll(`[data-fig]`).forEach(e=>{if(e.dataset.ready)return;e.dataset.ready=`1`;let t=e.querySelector(`.fig-tip`),n=t=>{e.classList.toggle(`is-focus`,!!t),e.querySelectorAll(`[data-s]`).forEach(e=>e.classList.toggle(`is-on`,!!t&&e.dataset.s===t))},r=(r,i,a)=>{t.innerHTML=r.dataset.tip??``,t.hidden=!1;let o=e.getBoundingClientRect(),s=r.getBoundingClientRect(),c=(i??s.left+s.width/2)-o.left,l=(a??s.top)-o.top,u=t.offsetWidth;t.style.left=`${Math.max(0,Math.min(o.width-u,c-u/2))}px`,t.style.top=`${Math.max(0,l-t.offsetHeight-12)}px`,r.dataset.s&&n(r.dataset.s)},i=()=>{t.hidden=!0,n(null)};e.querySelectorAll(`[data-tip]`).forEach(e=>{e.hasAttribute(`tabindex`)||e.setAttribute(`tabindex`,`0`),e.addEventListener(`pointerenter`,t=>t.pointerType===`mouse`&&r(e,t.clientX,t.clientY)),e.addEventListener(`pointermove`,t=>t.pointerType===`mouse`&&r(e,t.clientX,t.clientY)),e.addEventListener(`pointerleave`,e=>e.pointerType===`mouse`&&i()),e.addEventListener(`focus`,()=>r(e)),e.addEventListener(`blur`,i),e.addEventListener(`click`,t=>{t.pointerType!==`mouse`&&r(e)})}),e.querySelectorAll(`[data-legend]`).forEach(e=>{e.addEventListener(`pointerenter`,()=>n(e.dataset.legend)),e.addEventLis
